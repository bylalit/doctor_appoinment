{% extends "dashboard/layout.html" %}
{% load static %}

{% block contant %}
    <section class="w-100 bg-light" style="margin-top: 70px; margin-left: 18rem; padding: 50px;">
        
        <!-- Header Section -->
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="h3 fw-bold mb-1" style="color: rgb(95 111 255);">{{ title }}</h2>
                <p class="text-muted mb-0">Fill out the field below to save the department category</p>
            </div>
        </div>

        <!-- Form Card Container -->
        <div class="row">
            <div class="col-lg-6">
                <div class="bg-white rounded-4 shadow-sm p-5">
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Form Field -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary mb-2" style="font-size: 15px;">Speciality Name</label>
                            {{ form.name }}
                            {% if form.name.errors %}
                                <div class="text-danger small mt-1">{{ form.name.errors }}</div>
                            {% endif %}
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn text-white rounded-pill px-4 py-2 fw-semibold" 
                                    style="background: linear-gradient(135deg,#4f5dff,#8f9bff); border:none;">
                                Save Speciality
                            </button>
                            <a href="{% url 'speciality_list' %}" class="btn btn-light rounded-pill px-4 py-2 text-secondary border fw-semibold">
                                Cancel
                            </a>
                        </div>
                        
                    </form>

                </div>
            </div>
        </div>

    </section>
{% endblock contant %}
