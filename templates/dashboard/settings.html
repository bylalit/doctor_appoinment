{% extends "dashboard/layout.html" %}
{% load static %}

{% block contant %}

<section class="bg-light" style="min-height:100vh; width:100%; margin-top: 70px; margin-left: 18rem; padding: 50px;">

    <!-- 🔷 Header -->
    <div class="mb-4">
        <h3 class="fw-bold text-primary">Settings</h3>
        <p class="text-muted small">Manage your system preferences</p>
    </div>

    <div class="row g-4">

        <!-- 🔹 Profile Settings -->
        <div class="col-md-6">
            <div class="bg-white p-4 rounded-4 shadow-sm border">
                <h5 class="fw-bold mb-3">Profile Settings</h5>

                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="profile_update">

                    <div class="mb-3">
                        <label class="form-label small">Full Name</label>
                        <input type="text" name="full_name" class="form-control" 
                            value="{{ user.first_name }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">Email</label>
                        <input type="email" name="email" class="form-control" 
                            value="{{ user.email }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">Username</label>
                        <input type="text" class="form-control" 
                            value="{{ user.username }}" readonly>
                    </div>

                    <button class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>


        <!-- 🔹 Password Settings -->
        <div class="col-md-6">
            <div class="bg-white p-4 rounded-4 shadow-sm border">
                <h5 class="fw-bold mb-3">Change Password</h5>

                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="password_update">

                    <div class="mb-3">
                        <label class="form-label small">Current Password</label>
                        <input type="password" name="current_password" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">New Password</label>
                        <input type="password" name="new_password" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control">
                    </div>

                    <button class="btn btn-danger w-100">Update Password</button>
                </form>
            </div>
        </div>

    </div>

</section>

{% endblock contant %}
